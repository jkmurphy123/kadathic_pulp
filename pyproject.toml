[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulp-structure-builder"
version = "0.1.0"
description = "Pulp Structure Builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nicegui",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
